<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест по C# · SOFIA LEBEDEVA & 🐳</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container py-5" style="max-width: 820px;">

    <!-- Заголовок -->
    <header class="text-center mb-5">
      <h1 class="main-title">Тест по C#</h1>
      <p class="subtitle">Проверь свои знания основ языка 💜</p>
    </header>

    <!-- Стартовый экран (выбор темы) -->
    <div id="startBlock" class="card pastel-card mb-4 d-none">
      <div class="card-body p-5 text-center">
        <h4 class="mb-4">Выбери тему для теста</h4>
        <select id="themeSelect" class="form-select mb-4 form-select-lg" style="max-width: 400px; margin: 0 auto; border-radius: 12px;">
          <option value="all">Все темы</option>
        </select>
        <button id="startBtn" class="btn pastel-btn-primary btn-lg w-100" style="max-width: 300px;">Начать тест</button>
      </div>
    </div>

    <!-- Экран теста (скрыт до старта) -->
    <div id="quizBlock" class="d-none">
      <!-- Прогресс и таймер -->
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center small mb-2">
          <span id="progressText" class="text-muted">Вопрос 1</span>
          <span id="timerText" class="badge bg-danger p-2 fs-6">⏱ 10:00</span>
          <span id="scoreText" class="text-muted">Правильно: 0</span>
        </div>
        <div class="progress pastel-progress">
          <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%"></div>
        </div>
      </div>

      <!-- Карточка вопроса -->
      <div class="card pastel-card mb-4">
        <div class="card-body p-4 p-md-5">
          <div id="questionBlock">
            <span id="questionTheme" class="pastel-badge mb-3"></span>
            <h5 id="questionText" class="mb-4"></h5>
            <div id="answersBlock" class="d-grid gap-3"></div>
            <div id="feedback" class="mt-3 fw-bold text-center"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Результаты -->
    <div id="resultBlock" class="card pastel-card mb-4 d-none">
      <div class="card-body p-5 text-center">
        <div class="result-emoji">🎉</div>
        <h3 class="mb-3">Тест завершён!</h3>
        <p class="fs-4 mb-2">
          Правильных ответов: <strong id="finalScore"></strong> из <strong id="finalTotal"></strong>
        </p>
        <p id="bestScoreText" class="text-muted mb-4"></p>
        
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <button id="restartBtn" class="btn pastel-btn-primary">Пройти заново</button>
          <button id="downloadBtn" class="btn btn-outline-secondary" style="border-radius: 999px; padding: 0.75rem 1.5rem;">💾 Скачать результат</button>
        </div>
      </div>
    </div>

    <!-- Подпись -->
    <footer class="text-center mt-5">
      <p class="signature">SOFIA LEBEDEVA &amp; 🐳</p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
